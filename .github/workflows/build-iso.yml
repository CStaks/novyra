name: Build ISOs (x86_64 & ARM64)

on:
  push:
    branches: [main, iso-building-tests]
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build x86_64 ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install Archiso toolset and dependencies
        run: |
          pacman -Syu --noconfirm archiso libisoburn squashfs-tools grub git rsync

      - name: Inject x86 bootloader templates
        run: |
          mkdir -p "./src/novyra-x86+64/syslinux" "./src/novyra-x86+64/grub"
          cp -r /usr/share/archiso/configs/releng/syslinux/* "./src/novyra-x86+64/syslinux/"
          cp -r /usr/share/archiso/configs/releng/grub/* "./src/novyra-x86+64/grub/"

      - name: Checkout dotfiles repository
        uses: actions/checkout@v4
        with:
          repository: 'end-4/dots-hyprland'
          submodules: 'recursive'
          path: 'temp-dotfiles'

      - name: Deploy Dotfiles to /etc/skel
        run: |
          SKEL="$(pwd)/src/novyra-x86+64/airootfs/etc/skel"
          mkdir -p "$SKEL/.config" "$SKEL/.local"
          if [ -d "temp-dotfiles/dots/.config" ]; then
            cp -r temp-dotfiles/dots/.config/* "$SKEL/.config/"
          fi
          if [ -d "temp-dotfiles/dots/.local" ]; then
            cp -r temp-dotfiles/dots/.local/* "$SKEL/.local/"
          fi
          rm -rf temp-dotfiles

      - name: Build x86_64 ISO
        run: |
          mkarchiso -v -w work/ -o out/ "./src/novyra-x86+64"

      - name: Upload finished x86_64 ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arch-Live-ISO-x86_64
          path: out/*.iso

  build-arm64:
    name: Build ARM64 ISO (Emulated)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Build ARM64 ISO via Docker + QEMU
        run: |
          docker run --privileged --rm \
            --platform linux/arm64 \
            -v $(pwd):/workspace \
            -w /workspace \
            archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm archiso git rsync grub squashfs-tools libisoburn && \
              
              SKEL=\"/workspace/src/novyra-arm64/airootfs/etc/skel\" && \
              mkdir -p \"\$SKEL/.config\" && \
              git clone --recursive https://github.com/end-4/dots-hyprland.git /tmp/dotfiles && \
              if [ -d '/tmp/dotfiles/dots/.config' ]; then \
                cp -r /tmp/dotfiles/dots/.config/* \"\$SKEL/.config/\"; \
              fi && \
              rm -rf /tmp/dotfiles && \

              mkarchiso -v -w work/ -o out/ ./src/novyra-arm64
            "

      - name: Upload finished ARM64 ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arch-Live-ISO-arm64
          path: out/*.iso