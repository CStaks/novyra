name: Build ISO

on:
  push:
    branches: [main, iso-building-tests]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-x86_64-iso:
    runs-on: ubuntu-latest

    # Crucial: Must run inside an Arch container with host privileges
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Initialize and update Arch keyring
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman-key --init
          pacman-key --populate archlinux

      - name: Install Archiso toolset
        run: |
          pacman -Syu --noconfirm archiso libisoburn squashfs-tools grub

      - name: Create output, workspace, and missing configuration directories
        run: |
          mkdir -p work/
          mkdir -p out/
          # Ensure your profile directories exist
          mkdir -p ./src/novyra/syslinux
          mkdir -p ./src/novyra/grub

      - name: Inject default bootloader configurations
        run: |
          # Copy the missing templates from the official package into your profile
          cp -r /usr/share/archiso/configs/releng/syslinux/* ./src/novyra/syslinux/
          cp -r /usr/share/archiso/configs/releng/grub/* ./src/novyra/grub/

      - name: Build ISO using mkarchiso
        run: |
          mkarchiso -v -w work/ -o out/ ./src/novyra

      - name: Upload finished ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Arch-Live-ISO
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7

  build-arm64-iso:
    runs-on: ubuntu-24.04-arm64
    container:
      image: agners/archlinuxarm:latest
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Keyring & Tools
        run: |
          pacman -Sy --noconfirm archlinuxarm-keyring
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm archiso libisoburn squashfs-tools grub

      - name: Build ARM64 ISO
        run: |
          mkdir -p work/ out/
          mkarchiso -v -w work/ -o out/ ./src/novyra
