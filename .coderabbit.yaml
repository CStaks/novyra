language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "iso/**"
      instructions: |
        Review ArchISO profile correctness, package availability, systemd units, permissions,
        boot behavior, and whether changes work in both standard and NVIDIA variants.
    - path: ".github/workflows/**"
      instructions: |
        Review GitHub Actions permissions, secret handling, trigger behavior, reproducibility,
        artifact handling, SourceForge paths, and release versioning.
    - path: "scripts/**"
      instructions: |
        Review shell safety, quoting, idempotency, destructive operations, error handling,
        and behavior on SATA, NVMe, and eMMC devices.

chat:
  auto_reply: true
